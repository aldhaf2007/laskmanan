{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}
{% block page_title %}500 - Server Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚠️</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--danger); margin-bottom: 0.5rem;">Internal Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">An unexpected error occurred while processing your request.</p>
    <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
