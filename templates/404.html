{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}404 - Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 3.5rem; margin-bottom: 1rem;">🔍</div>
    <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem;">Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">The page or record you are looking for does not exist.</p>
    <div>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
